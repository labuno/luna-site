name: CI

# Public-repository CI never touches the private content repository:
# external contributors can run everything with the demo content in examples/.

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

jobs:
  build-demo:
    name: Test and build with demo content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and workflow tests
        run: npm run test

      - name: Type check
        run: npm run check

      - name: Build with demo content
        run: npm run build:demo
